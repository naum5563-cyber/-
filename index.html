<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оцени альтушку</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1e2230;
        --accent: #7c4dff;
        --muted: #6b7280;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10131a;
          --card: #171b24;
          --text: #e5e7eb;
          --accent: #a78bfa;
          --muted: #9ca3af;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 780px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      h1 {
        margin: 0 0 20px;
        text-align: center;
      }

      .card {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 20px;
        padding: 20px;
        border-radius: 18px;
        background: var(--card);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
      }

      .photo {
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border-radius: 14px;
      }

      .meta h2 { margin: 0 0 8px; }
      .meta p { margin: 0 0 20px; color: var(--muted); }

      .rating {
        font-size: 28px;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 16px;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      button {
        border: none;
        background: color-mix(in oklab, var(--accent), var(--card) 60%);
        color: white;
        border-radius: 10px;
        padding: 10px;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover { filter: brightness(1.07); }

      .nav {
        margin-top: 18px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      .nav button {
        flex: 1;
        background: color-mix(in oklab, var(--accent), black 25%);
      }

      @media (max-width: 640px) {
        .card { grid-template-columns: 1fr; }
        .buttons { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Оцени альтушку</h1>
      <section class="card">
        <img id="photo" class="photo" alt="Фото профиля" />
        <div class="meta">
          <h2 id="name"></h2>
          <p id="age"></p>
          <div id="rating" class="rating">Оценка: —</div>
          <div class="buttons" id="ratingButtons"></div>
          <div class="nav">
            <button id="prev">← Назад</button>
            <button id="next">Дальше →</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const profiles = [
        {
          id: 1,
          name: 'Алина',
          age: 20,
          photo: 'https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?auto=format&fit=crop&w=800&q=80',
        },
        {
          id: 2,
          name: 'Лера',
          age: 22,
          photo: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=800&q=80',
        },
        {
          id: 3,
          name: 'Кира',
          age: 19,
          photo: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=800&q=80',
        },
      ];

      const ratings = {};
      let currentIndex = 0;

      const photoEl = document.getElementById('photo');
      const nameEl = document.getElementById('name');
      const ageEl = document.getElementById('age');
      const ratingEl = document.getElementById('rating');
      const buttonsEl = document.getElementById('ratingButtons');
      const prevBtn = document.getElementById('prev');
      const nextBtn = document.getElementById('next');

      function renderButtons() {
        buttonsEl.innerHTML = '';
        for (let i = 1; i <= 10; i++) {
          const btn = document.createElement('button');
          btn.textContent = String(i);
          btn.addEventListener('click', () => {
            const profile = profiles[currentIndex];
            ratings[profile.id] = i;
            renderProfile();
          });
          buttonsEl.appendChild(btn);
        }
      }

      function renderProfile() {
        const profile = profiles[currentIndex];
        photoEl.src = profile.photo;
        nameEl.textContent = profile.name;
        ageEl.textContent = `Возраст: ${profile.age}`;
        const value = ratings[profile.id];
        ratingEl.textContent = value ? `Оценка: ${value}/10` : 'Оценка: —';
      }

      prevBtn.addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + profiles.length) % profiles.length;
        renderProfile();
      });

      nextBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % profiles.length;
        renderProfile();
      });

      renderButtons();
      renderProfile();
    </script>
  </body>
</html>
